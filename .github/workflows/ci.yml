name: Project CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lambda-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Lambda syntax
        run: python -m compileall vehicle-management-app/vehicle-management-app/Lambda

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vehicle-management-app/vehicle-management-app/front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vehicle-management-app/vehicle-management-app/front-end/package-lock.json
      - run: npm ci
      - run: npm run build
